# schemaops pipeline.
#
# Merge request pipelines only validate. They receive no deployment credentials.
# Deployments run only from the protected default branch: one child pipeline per
# environment, with one job per cluster, so clusters deploy independently.
#
# Required project setup is described in README.md ("GitLab setup" and "Pipeline").

include:
  - local: ci/common.yml
  - template: Jobs/Secret-Detection.gitlab-ci.yml   # backs up the "no credentials in Git" rule

stages: [build, test, validate, deploy]

# The template's job, adjusted to scan merge requests too and to skip our setup step.
secret_detection:
  before_script: []
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ------------------------------------------------------------------ image

# Builds the image with git, percona-toolkit and the Python dependencies preinstalled.
# Needs a runner that allows Docker-in-Docker. Also runnable from "Run pipeline" with BUILD_IMAGE=1.
build-image:
  stage: build
  image: docker:27
  services: ["docker:27-dind"]
  before_script: []
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "web" && $BUILD_IMAGE
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"
      changes: [Dockerfile, pyproject.toml]
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker build -t "$CI_REGISTRY_IMAGE/runner:latest" .
    - docker push "$CI_REGISTRY_IMAGE/runner:latest"

# ------------------------------------------------------------------ tests

unit-tests:
  stage: test
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - changes: [src/**/*, tests/**/*, pyproject.toml]
  script:
    - pip install --quiet ".[dev]"
    - python -m pytest -q

# Runs real migrations with the real pt-online-schema-change against a throwaway MariaDB.
integration-tests:
  stage: test
  services:
    - name: mariadb:11.4
      alias: mariadb
  variables:
    MARIADB_ROOT_PASSWORD: it-root-pw
    SCHEMAOPS_IT_HOST: mariadb
    SCHEMAOPS_IT_ROOT_PASSWORD: it-root-pw
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - changes: [src/**/*, tests/**/*, pyproject.toml]
  script:
    - pip install --quiet ".[dev]"
    - python -m pytest -q tests/integration

# --------------------------------------------------------- merge requests

check-mr:
  stage: validate
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  variables:
    SCHEMAOPS_MR_COMMENT: "1"                  # post the plan on the merge request
    SCHEMAOPS_MR_REPORT: schemaops-plan.md     # and keep it as a job artifact
  artifacts:
    when: always
    paths: [schemaops-plan.md]
  script:
    # Run the checks with the tool as it is on the target branch, not the copy in the merge request.
    - git fetch --quiet origin "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
    - git worktree add --quiet /tmp/trusted "origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
    - pip install --quiet /tmp/trusted
    - schemaops check-mr

# ------------------------------------------------------------ deployments
#
# For each environment: a "generate" job writes a child pipeline with one job per changed
# cluster, and a "deploy" job runs it. A failure on one cluster does not stop the others.

.generate:
  stage: deploy
  script:
    - pip install --quiet .
    - schemaops pipeline --env "$SCHEMAOPS_ENV" --changed-since "$CI_COMMIT_BEFORE_SHA" --output "deploy-$SCHEMAOPS_ENV.yml"
  artifacts:
    paths: ["deploy-*.yml"]

generate-dev:
  extends: .generate
  variables: { SCHEMAOPS_ENV: dev }
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"
      changes: [clusters/**/migrations/dev/*, clusters/**/environments/dev.yaml]

deploy-dev:
  stage: deploy
  needs: [generate-dev]
  inherit:
    default: false
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"
      changes: [clusters/**/migrations/dev/*, clusters/**/environments/dev.yaml]
  trigger:
    include: [{ artifact: deploy-dev.yml, job: generate-dev }]
    strategy: depend

generate-uat:
  extends: .generate
  variables: { SCHEMAOPS_ENV: uat }
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"
      changes: [clusters/**/migrations/uat/*, clusters/**/environments/uat.yaml]

deploy-uat:
  stage: deploy
  needs: [generate-uat]
  inherit:
    default: false
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"
      changes: [clusters/**/migrations/uat/*, clusters/**/environments/uat.yaml]
  trigger:
    include: [{ artifact: deploy-uat.yml, job: generate-uat }]
    strategy: depend

generate-prod:
  extends: .generate
  variables: { SCHEMAOPS_ENV: prod }
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"
      changes: [clusters/**/migrations/prod/*, clusters/**/environments/prod.yaml]

# Shows what the PROD deployment will do (live table sizes, pre-flight checks) before anyone
# starts it. Reads only.
plan-prod:
  stage: deploy
  environment:
    name: prod
    action: prepare
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"
      changes: [clusters/**/migrations/prod/*, clusters/**/environments/prod.yaml]
  script:
    - pip install --quiet .
    - schemaops plan --env prod --changed-since "$CI_COMMIT_BEFORE_SHA"

# Started by hand, after reading plan-prod.
deploy-prod:
  stage: deploy
  needs: [generate-prod, plan-prod]
  inherit:
    default: false
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"
      changes: [clusters/**/migrations/prod/*, clusters/**/environments/prod.yaml]
      when: manual
  trigger:
    include: [{ artifact: deploy-prod.yml, job: generate-prod }]
    strategy: depend

# ------------------------------------------------------- DBA manual jobs
#
# Start these from "Run pipeline" on the default branch, with the variables set.

# After applying a protected-table change by hand: MARK_ENV, MARK_CLUSTER, MARK_SCHEMA, MARK_FILE.
mark-applied:
  stage: deploy
  environment: $MARK_ENV
  resource_group: schemaops-$MARK_CLUSTER-$MARK_ENV
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "web" && $MARK_FILE
  script:
    - pip install --quiet .
    - schemaops mark-applied --env "$MARK_ENV" --cluster "$MARK_CLUSTER" --schema "$MARK_SCHEMA" --file "$MARK_FILE"

# After checking a failed migration: RETRY_ENV, RETRY_CLUSTER, RETRY_SCHEMA.
retry-failed:
  stage: deploy
  environment: $RETRY_ENV
  resource_group: schemaops-$RETRY_CLUSTER-$RETRY_ENV
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "web" && $RETRY_SCHEMA
  script:
    - pip install --quiet .
    - schemaops deploy --env "$RETRY_ENV" --cluster "$RETRY_CLUSTER" --schema "$RETRY_SCHEMA" --retry-failed
  allow_failure:
    exit_codes: [3]

# -------------------------------------------------------------- schedule
#
# Create one pipeline schedule per environment, each with SCHEMAOPS_RECONCILE_ENV set
# (dev, uat or prod). Reads only; fails and notifies when Git and a database disagree.
reconcile:
  stage: deploy
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $SCHEMAOPS_RECONCILE_ENV
  environment:
    name: $SCHEMAOPS_RECONCILE_ENV
    action: verify
  script:
    - pip install --quiet .
    - schemaops reconcile --env "$SCHEMAOPS_RECONCILE_ENV" --all
